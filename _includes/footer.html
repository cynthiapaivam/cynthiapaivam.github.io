<footer class="site-footer">
  <div class="footer-inner inner">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.owner }}</span>
    <ul class="social-links" aria-label="Redes sociais">
      {% for social in site.social %}{% if social[1] and social[0] != 'email' %}
      <li><a href="{{ social[1] }}" target="_blank" rel="noopener noreferrer">{{ social[0] | replace: '-', ' ' | capitalize }}</a></li>
      {% endif %}{% endfor %}
      <li><a href="mailto:{{ site.email }}">E-mail</a></li>
    </ul>
  </div>
</footer>
